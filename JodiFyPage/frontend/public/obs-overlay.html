<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JodiFy Stream Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 24px;
    }

    /* Contenedor principal del Widget con doble bisel y sombra difusa */
    .jf-widget {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px 14px 14px;
      border-radius: 20px;
      background: rgba(12, 14, 22, 0.88);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.22);
      min-width: 360px;
      max-width: 480px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(24px) scale(0.96);
    }

    .jf-widget.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Aura reactiva exterior */
    .jf-widget::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.35), rgba(127, 0, 255, 0.35));
      z-index: -1;
      opacity: 0.5;
      filter: blur(12px);
      transition: opacity 0.5s ease;
    }

    /* Portada de la canción y vinilo */
    .jf-art-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .jf-art {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 2;
    }

    /* Soundwave bars superpuestas sobre la esquina */
    .jf-bars {
      position: absolute;
      bottom: 4px;
      right: 4px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
      padding: 3px 4px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      border-radius: 5px;
      z-index: 3;
    }

    .jf-bar {
      width: 3px;
      background: #00f0ff;
      border-radius: 2px;
      animation: jf-bar-dance 1.1s ease-in-out infinite alternate;
    }

    .jf-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
    .jf-bar:nth-child(2) { height: 14px; animation-delay: 0.25s; background: #a855f7; }
    .jf-bar:nth-child(3) { height: 9px; animation-delay: 0.45s; }

    @keyframes jf-bar-dance {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .jf-widget.is-paused .jf-bar {
      animation-play-state: paused;
      opacity: 0.5;
    }

    /* Contenido de texto */
    .jf-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .jf-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .jf-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(0, 240, 255, 0.12);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .jf-badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 6px #00f0ff;
      animation: jf-pulse 1.8s infinite;
    }

    @keyframes jf-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .jf-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .jf-artist {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Línea de progreso interactiva */
    .jf-progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .jf-progress-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .jf-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #a855f7);
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
      transition: width 0.35s linear;
    }

    .jf-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
    }

    /* TEMAS ADICIONALES */
    /* 1. Neón Cyberpunk */
    body[data-theme="neon"] .jf-widget {
      background: rgba(5, 5, 12, 0.94);
      border-color: #00f0ff;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1);
    }

    /* 2. Glassmorphism Puro */
    body[data-theme="glass"] .jf-widget {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    /* 3. Mini Cápsula */
    body[data-theme="minimal"] .jf-widget {
      padding: 8px 16px 8px 8px;
      border-radius: 99px;
      min-width: 280px;
    }
    body[data-theme="minimal"] .jf-art-wrap {
      width: 44px;
      height: 44px;
    }
    body[data-theme="minimal"] .jf-art {
      border-radius: 99px;
    }
  </style>
</head>
<body>
  <div class="jf-widget" id="widget">
    <div class="jf-art-wrap">
      <img id="cover" class="jf-art" src="logo.png" alt="Cover">
      <div class="jf-bars" id="bars">
        <span class="jf-bar"></span>
        <span class="jf-bar"></span>
        <span class="jf-bar"></span>
      </div>
    </div>
    <div class="jf-meta">
      <div class="jf-badge-row">
        <span class="jf-badge">
          <span class="jf-badge-dot"></span>
          <span id="status-text">EN VIVO</span>
        </span>
      </div>
      <p class="jf-title" id="title">Esperando música…</p>
      <p class="jf-artist" id="artist">JodiFy Studio</p>
      <div class="jf-progress-row">
        <div class="jf-progress-track">
          <div class="jf-progress-fill" id="progress-fill"></div>
        </div>
        <span class="jf-time" id="time-display">0:00</span>
      </div>
    </div>
  </div>

  <script>
    const widget = document.getElementById('widget');
    const coverEl = document.getElementById('cover');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const statusTextEl = document.getElementById('status-text');
    const progressFill = document.getElementById('progress-fill');
    const timeDisplay = document.getElementById('time-display');

    // Parse URL theme
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'default';
    if (theme !== 'default') {
      document.body.setAttribute('data-theme', theme);
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateState(data) {
      if (!data || !data.title) {
        widget.classList.remove('is-visible');
        return;
      }

      widget.classList.add('is-visible');
      titleEl.textContent = data.title;
      artistEl.textContent = data.artist || (data.addedBy ? `Por ${data.addedBy}` : 'JodiFy Artist');

      if (data.cover && coverEl.src !== data.cover) {
        coverEl.src = data.cover;
      }

      if (data.isPlaying) {
        widget.classList.remove('is-paused');
        statusTextEl.textContent = 'EN VIVO';
      } else {
        widget.classList.add('is-paused');
        statusTextEl.textContent = 'EN PAUSA';
      }

      if (data.duration && data.duration > 0) {
        const pct = Math.min(100, Math.max(0, (data.currentTime / data.duration) * 100));
        progressFill.style.width = `${pct}%`;
        timeDisplay.textContent = `${formatTime(data.currentTime)} / ${formatTime(data.duration)}`;
      } else {
        progressFill.style.width = '0%';
        timeDisplay.textContent = formatTime(data.currentTime);
      }
    }

    // 1. Sincronización vía BroadcastChannel
    try {
      const channel = new BroadcastChannel('jodify_obs_channel');
      channel.onmessage = (event) => {
        if (event.data) updateState(event.data);
      };
    } catch (e) {
      console.warn('BroadcastChannel no soportado:', e);
    }

    // 2. Sincronización vía LocalStorage
    window.addEventListener('storage', (e) => {
      if (e.key === 'jodify_obs_overlay_state' && e.newValue) {
        try {
          updateState(JSON.parse(e.newValue));
        } catch {}
      }
    });

    // 3. Cargar estado inicial de localStorage
    try {
      const initial = localStorage.getItem('jodify_obs_overlay_state');
      if (initial) updateState(JSON.parse(initial));
    } catch {}

    // 4. Polling continuo a servidor local Desktop (http://127.0.0.1:8765/api/current)
    async function pollLocalServer() {
      try {
        const res = await fetch('http://127.0.0.1:8765/api/current', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          updateState(data);
        }
      } catch (err) {
        // En web o cuando no hay servidor local, se apoya en BroadcastChannel y storage
      }
    }

    setInterval(pollLocalServer, 1000);
    pollLocalServer();
  </script>
</body>
</html>
